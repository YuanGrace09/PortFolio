<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>포트폴리오CSSHTMLJS</title>
	<link rel="stylesheet" href="index.css">
</head>
<body>
	<div class="drag-container" id="dragContainer">
		<!-- 배경 확장을 위한 사각형 오버레이 레이어 -->
		<div class="expand-overlay" id="expandOverlay"></div>

		<!-- 우측 상단 PIP 모드 변환 이미지 버튼 (배경 없음) -->
		<div class="target-zone" id="targetZone">
			<img src="Image/light-off.png" 
			     data-off-src="Image/light-off.png" 
			     data-on-src="Image/light-on.png" 
			     alt="PIP Control Button" 
			     id="pipControlImg" 
			     class="pip-control-img">
		</div>

		<img src="image/square.png" alt="Follower 1" class="follower" id="follower1">
		<img src="image/square.png" alt="Follower 2" class="follower" id="follower2">
		<img src="image/square.png" alt="Follower 3" class="follower" id="follower3">
		<img src="image/square.png" alt="Follower 4" class="follower" id="follower4">
		<img src="image/square.png" alt="Follower 5" class="follower" id="follower5">
	</div>

	<script src="index.js"></script>
</body>
</html>
